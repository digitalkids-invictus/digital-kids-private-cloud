name: Deploy Infrastructure and DB Schema

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Import Existing Resources if State is Missing
        working-directory: ./terraform
        env:
          TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
          TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          # Si el archivo tfstate no existe en el repo, intentamos importar lo que ya está creado en Render
          if [ ! -f "terraform.tfstate" ]; then
            echo "El archivo tfstate no existe. Intentando importar recursos existentes..."
            
            # NOTA: Reemplaza estos IDs con los reales de tus recursos en Render (los ves en la URL de tu dashboard)
            # Ejemplo: terraform import render_postgres.db srv-xxxxxxxxxxxx
            # terraform import render_web_service.app srv-yyyyyyyyyyyy
            
            # Si prefieres que Terraform busque por nombre o prefieres asignarlos, 
            # asegurate de tener los IDs de Render o usa terraform import con el ID del servicio/bd de Render:
            # terraform import render_postgres.db <ID_DE_LA_BD_EN_RENDER> || true
            # terraform import render_web_service.app <ID_DEL_SERVICIO_EN_RENDER> || true
          fi

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
          TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          terraform apply -auto-approve

      - name: Save TFState Back to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/terraform.tfstate terraform/terraform.tfstate.backup || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update terraform state [skip ci]"
            git push origin main
          fi

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL Script
        working-directory: ./terraform
        run: |
          echo "Esperando a que la base de datos esté completamente lista..."
          sleep 15
          
          DB_URL=$(terraform output -raw postgres_connection_string)
          
          for i in {1..5}; do
            echo "Intento $i de conexión a la base de datos..."
            if psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../init.sql; then
              echo "¡Script SQL ejecutado con éxito!"
              exit 0
            fi
            sleep 10
          done
          exit 1