name: Deploy Infrastructure and DB Schema

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Import Existing Resources Automatically
        working-directory: ./terraform
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
          TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          if [ ! -f "terraform.tfstate" ]; then
            echo "Buscando recursos existentes en Render con jq..."
            
            RESPONSE=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=20")
            
            # Extraer IDs usando jq de manera limpia y precisa
            DB_ID=$(echo "$RESPONSE" | jq -r '.[] | select(.service.name == "persistent-postgres") | .service.id')
            APP_ID=$(echo "$RESPONSE" | jq -r '.[] | select(.service.name == "docker-web-app") | .service.id')
            
            if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
              echo "Base de datos encontrada ($DB_ID). Importando a Terraform..."
              terraform import render_postgres.db "$DB_ID"
            else
              echo "No se encontró la base de datos en Render, se creará una nueva."
            fi
            
            if [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ]; then
              echo "Servicio web encontrado ($APP_ID). Importando a Terraform..."
              terraform import render_web_service.app "$APP_ID"
            else
              echo "No se encontró el servicio web en Render, se creará uno nuevo."
            fi
          fi

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
          TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          terraform apply -auto-approve

      - name: Save TFState Back to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/terraform.tfstate terraform/terraform.tfstate.backup || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update terraform state [skip ci]"
            git push origin main
          fi

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL Script
        working-directory: ./terraform
        run: |
          echo "Esperando a que la base de datos esté completamente lista..."
          sleep 15
          
          DB_URL=$(terraform output -raw postgres_connection_string)
          
          for i in {1..5}; do
            echo "Intento $i de conexión a la base de datos..."
            if psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../init.sql; then
              echo "¡Script SQL ejecutado con éxito!"
              exit 0
            fi
            sleep 10
          done
          exit 1